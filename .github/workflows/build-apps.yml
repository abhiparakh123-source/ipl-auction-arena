name: Build IPL Auction Arena apps
on:
  push:
    branches: [main]
    paths: ['app-wrapper/**', '.github/workflows/build-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app-wrapper/dist/*.exe
          if-no-files-found: error
          retention-days: 14
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
              - name: Setup Android SDK
          uses: android-actions/setup-android@v4
          with:
            packages: 'platform-tools'
      - run: npm install
      - name: Create placeholder web directory
        run: |
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><title>IPL Auction Arena</title></head><body>Loading IPL Auction Arena...</body></html>' > www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
